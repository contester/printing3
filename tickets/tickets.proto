syntax = "proto3";

package tickets;

option go_package = "github.com/contester/printing3/tickets";

message PrintJob {
    string filename = 1;
    IdName contest = 2;
    IdName team = 3;
    Computer computer = 4;
    IdName area = 5;
    bytes data = 6;
    uint64 timestamp_seconds = 7;
    string printer = 8;
    string job_id = 9;
    string charset = 10;
};

message PrintJobReport {
    string job_expanded_id = 1;
    int64 num_pages = 2;
    // Empty on success.
    string error_message = 3;
    int64 timestamp_seconds = 4;
    // What the print agent observed, for humans: spooler job state, printer status.
    string detail = 5;
    // Pages the print spooler reports as printed; 0 if it couldn't tell.
    int64 pages_printed = 6;
    // Job id in the print spooler of the machine that ran the print agent.
    uint32 spooler_job_id = 7;

    enum Stage {
        // A final result: success if error_message is empty. This is what
        // reports without a stage have always meant.
        FINAL = 0;
        // The job was rendered and handed to the print agent; render is set.
        RENDERED = 1;
    }
    Stage stage = 8;
    // Only for stage RENDERED. printer and job_id in it are the attempt's.
    BinaryJob render = 9;
}

// A network printer that the machine running the print agent is connected to.
message RemotePrinter {
    // The printer name as the agent uses it to print: \\server\share.
    string unc = 1;
    string server = 2;
    string share = 3;
}

// What printers the print agent can print to. Sent at startup and
// periodically; the latest message from an agent replaces the earlier ones.
message PrinterList {
    // Name of the print agent (its machine), to tell several agents apart.
    string agent = 1;
    int64 timestamp_seconds = 2;
    repeated RemotePrinter printers = 3;
}

// A printer that has jobs waiting stopped being able to print (paper out,
// jam, offline, ...), or works again. The agent sends one when the condition
// has lasted a while, and one when it is gone; the web application tells
// people.
message PrinterAlert {
    string agent = 1;
    // The printer as named in the jobs, e.g. \\server\share.
    string printer = 2;
    // true: the printer cannot print; false: it works again.
    bool open = 3;
    // What is wrong, for people. Empty when open is false.
    string condition = 4;
    // Number of unfinished jobs in the printer's queue.
    uint32 waiting_jobs = 5;
    // When the condition was first seen.
    int64 since_seconds = 6;
    int64 timestamp_seconds = 7;
}

message TexJob {
    string printer = 1;
    bytes data = 2;
    string job_id = 3;
}

message BinaryJob {
    string printer = 1;
    // Field 2 was a plain "bytes data" holding PostScript; the wire format of
    // a oneof member is the same, so old and new peers still understand it.
    oneof payload {
        bytes ps = 2;
        bytes pdf = 5;
    }
    string job_id = 3;
    int64 pages = 4;
};

message IdName {
    uint32 id = 1;
    string name = 2;
};

message Computer {
    string id = 1;
    string name = 2;
};

message Ticket {
    message Submit {
        message School {
            uint32 tests_taken = 1;
            uint32 tests_passed = 2;
        }

        message ACM {
            string result = 1; // replace with uint32 and map
            uint32 test_id = 2;
        }

        uint32 submit_number = 1;
        uint64 arrived = 2;
        bool compiled = 3;
        School school = 4;
        ACM acm = 5;
    }

    message Problem {
        string id = 1;
        string name = 2;
    }

    IdName contest = 1;
    IdName team = 2;
    IdName area = 3;
    Computer computer = 4;
    Problem problem = 5;

    uint32 submit_id = 6;
    uint64 judge_time = 7;

    repeated Submit submit = 8;
    string printer = 9; // string now, replace with id
};