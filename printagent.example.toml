# Copy to config.toml next to printagent.exe, or pass -config.
# pdfium.dll, used for PDF jobs. A relative path is looked up next to
# printagent.exe. PDFium comes in win-x64 builds from
# https://github.com/bblanchon/pdfium-binaries and ships in this package.
# pdfium = "pdfium.dll"
# Directory for the PostScript files that are being printed.
workdir = "c:\\a\\w"
# gsprint.exe from Ghostgum/GSview. A bare name is looked up in PATH.
gsprint = "gsprint"
stompdsn = "contester:CHANGEME@tcp(broker.example.org)//contester"
# binaryqueue is read, failurequeue is where reports go. They must match
# BUSYPRINT_BINARYQUEUE and BUSYPRINT_FAILUREQUEUE of printing3-busyprint.
binaryqueue = "contester.binaryproto"
failurequeue = "contester.printingresult"
# Seconds to wait for a job to leave the print queue before reporting it as
# stuck (default 300).
# jobtimeoutseconds = 300
# Set to true to skip the printer status check (offline etc.) before printing.
# skippreflight = false
# Name of this agent in the list of remote printers that is sent to the web
# application (default: the host name). The list is sent to printersqueue
# (default contester.printers) every printersintervalseconds (default 300).
# agentname = "hall-printserver"
# printersqueue = "contester.printers"
# printersintervalseconds = 300
